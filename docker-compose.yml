# XS247: chạy toàn bộ hệ thống trên một máy (VPS hoặc Docker Desktop trên Windows).
#   docker compose up -d --build
name: luckey

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luckey}
      POSTGRES_USER: ${POSTGRES_USER:-luckey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luckey} -d ${POSTGRES_DB:-luckey}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: &app_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-luckey}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-luckey}
      REDIS_URL: redis://redis:6379/0
      RAW_DIR: /data/raw
      FIXTURE_DIR: /app/fixtures
    command: >
      sh -c "python -m xs247.cli migrate &&
             uvicorn xs247.api.main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      retries: 10

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: *app_env
    command: ["python", "-m", "xs247.worker"]
    volumes:
      - rawdata:/data/raw
    depends_on:
      api: {condition: service_healthy}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  rawdata:
  caddy_data:
  caddy_config:
