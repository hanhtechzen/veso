{% if scope %}<form class="scope print-hide" onsubmit="return false" aria-label="Phạm vi thống kê">
  <label><span>Loại xổ số</span><select onchange="location.href=this.value">{% for href, name, on in scope.kinds %}<option value="{{ href }}"{% if on %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label>
  {% if scope.options|length > 1 %}<label><span>{{ scope.label }}</span><select onchange="location.href=this.value">{% for href, name, on in scope.options %}<option value="{{ href }}"{% if on %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label>{% endif %}
</form>{% endif %}
