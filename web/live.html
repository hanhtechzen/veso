<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LuckyVision: tường thuật trực tiếp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--surface:#fff;--ink:#141B2D;--muted:#5B6578;--line:#E0E5EC;--red:#D12A2A;--gold:#F2B01E;--good:#1F7A4C;--header:#9F1B1B;--header-2:#6E1010;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0A0F1C;--surface:#121A2B;--ink:#E8ECF4;--muted:#98A3B9;--line:#263049;--good:#5CC48D;--header:#661515;--header-2:#3A0B0B;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
header{background:linear-gradient(120deg,var(--header),var(--header-2));color:#fff;padding:14px 20px}
header .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.conn{margin-left:auto;font-size:.85rem;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#999}
.dot.on{background:#3DDC84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
main{max-width:1100px;margin:0 auto;padding:22px 20px 40px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
h1{font-size:1.5rem;margin:0 0 2px;letter-spacing:-.02em}
h2{font-size:1rem;margin:0 0 10px}
.muted{color:var(--muted);font-size:.88rem}
.sched a{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:10px;text-decoration:none;color:inherit;font-size:.92rem}
.sched a:hover{background:var(--bg)}
.sched a[aria-current]{background:var(--bg);font-weight:700}
.pill{flex:none;align-self:center;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--red);color:#fff}
.pill.published{background:var(--good);color:#fff}
.pill.overdue{background:var(--gold);color:#141B2D}
.status{display:flex;align-items:center;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{width:26%;text-align:left;font-size:.8rem;color:var(--muted);font-weight:600;padding:9px 6px;border-bottom:1px dashed var(--line)}
td{padding:7px 6px;border-bottom:1px dashed var(--line)}
.num{display:inline-flex;min-width:2.4em;justify-content:center;margin:2px 4px;padding:3px 8px;border-radius:8px;font:700 1.1rem "IBM Plex Mono",monospace;background:var(--bg);color:var(--muted)}
.num.wait{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px);min-width:3.2em}
.num.new{animation:pop .6s cubic-bezier(.3,1.5,.6,1);background:var(--gold);color:#141B2D}
.num.set{color:var(--ink)}
tr.db .num{font-size:1.5rem;color:var(--red)}
tr.db .num.new{color:#141B2D}
tr.db .num.wait{color:transparent}
@keyframes pop{from{transform:scale(.4) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.log{font:500 .78rem "IBM Plex Mono",monospace;max-height:260px;overflow:auto;white-space:pre-wrap;color:var(--muted)}
.balls{display:flex;gap:8px;flex-wrap:wrap}
.ball{width:3em;height:3em;border-radius:50%;display:grid;place-items:center;font:800 1.15rem "Be Vietnam Pro",sans-serif;color:#141B2D;
  background:radial-gradient(circle at 50% 52%,#fff 0 46%,transparent 47%),radial-gradient(circle at 32% 24%,#FF8A7E,var(--red) 45%,#8E1515);box-shadow:inset -2px -3px 5px rgba(0,0,0,.3),0 4px 8px -3px rgba(15,23,42,.45)}
.ball.sp{background:radial-gradient(circle at 50% 52%,#fff 0 46%,transparent 47%),radial-gradient(circle at 32% 24%,#FFE08A,#F2B01E 45%,#93650A)}
.ball.wait{background:var(--bg);box-shadow:none;border:2px dashed var(--line);color:transparent}
.ball.new{animation:pop .6s cubic-bezier(.3,1.5,.6,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<link rel="stylesheet" href="/assets/lv-colors.css">
</head>
<body>
<header><div class="in"><b>LuckyVision</b><span>Tường thuật trực tiếp</span><span class="conn"><span class="dot" id="dot"></span><span id="connText">Đang kết nối…</span></span></div></header>
<main>
  <aside class="card">
    <h2>Lịch quay</h2>
    <input type="date" id="day" style="width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px">
    <div class="sched" id="sched"><p class="muted">Đang tải…</p></div>
  </aside>
  <section>
    <div class="card">
      <h1 id="title">Chọn một kỳ quay</h1>
      <div class="muted" id="sub"></div>
      <div class="status" id="status"></div>
      <div id="board"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Sự kiện nhận được</h2>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>
<script>
const qs = new URLSearchParams(location.search);
const API = (qs.get('api') || '').replace(/\/$/, '');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current = null, drawData = null, es = null;
const STATE = {scheduled:['Chờ quay',''], live:['Đang quay','live'], published:['Đã công bố','published'], overdue:['Quá giờ','overdue']};

function fmtTime(iso){ return new Date(iso).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Ho_Chi_Minh'}); }
function log(text){ const el=$('#log'); el.textContent = new Date().toLocaleTimeString('vi-VN') + '  ' + text + '\n' + el.textContent; }

async function loadSchedule(){
  const day = $('#day').value;
  try{
    const r = await fetch(`${API}/v1/schedule?date=${day}`, {cache:'no-store'}); const d = await r.json();
    $('#sched').innerHTML = d.items.length ? d.items.map(x => {
      const [label, cls] = STATE[x.state] || [x.state,''];
      return `<a href="?draw=${encodeURIComponent(x.id)}${API?'&api='+encodeURIComponent(API):''}" data-id="${esc(x.id)}" ${x.id===current?'aria-current="true"':''}>
        <span>${esc(x.province.name)}<br><span class="muted">${fmtTime(x.draw_time)}</span></span><span class="pill ${cls}">${label}</span></a>`;
    }).join('') : '<p class="muted">Không có kỳ quay nào trong ngày này.</p>';
  }catch(e){ $('#sched').innerHTML = '<p class="muted">Không tải được lịch quay.</p>'; }
}

function render(){
  const d = drawData; if(!d) return;
  $('#title').textContent = d.province.name || d.id;
  $('#sub').textContent = `Kỳ quay ${new Date(d.draw_date+'T00:00:00').toLocaleDateString('vi-VN')} lúc ${fmtTime(d.draw_time)}`;
  const st = d.provisional === false || d.version ? ['Đã xác minh và công bố','published'] :
             d.prizes.some(p=>p.numbers.length) ? ['Đang quay, chưa xác minh','live'] : ['Chờ quay',''];
  $('#status').innerHTML = `<span class="pill ${st[1]}">${st[0]}</span>` + (d.version ? `<span class="muted">Phiên bản ${d.version}</span>` : '');
  if (d.region === 'vl') {
    const main = d.prizes.find(p=>p.code==='main') || {numbers:[]}, sp = d.prizes.find(p=>p.code==='special') || {numbers:[]};
    const cells = [...Array(6)].map((_,i)=> main.numbers[i] ? `<span class="ball" data-k="main-${i}">${esc(main.numbers[i])}</span>` : '<span class="ball wait">00</span>');
    cells.push(sp.numbers[0] ? `<span class="ball sp" data-k="special-0">${esc(sp.numbers[0])}</span>` : '<span class="ball sp wait">00</span>');
    $('#board').innerHTML = `<div class="balls">${cells.join('')}</div>`;
    return;
  }
  $('#board').innerHTML = '<table><tbody>' + d.prizes.map(p => {
    const count = d.expected?.[p.code] || p.numbers.length || 1;
    const cells = [...Array(Math.max(count, p.numbers.length))].map((_,i)=> p.numbers[i]
      ? `<span class="num set" data-k="${esc(p.code)}-${i}">${esc(p.numbers[i])}</span>` : '<span class="num wait">0000</span>');
    return `<tr class="${esc(p.code)}"><th>${esc(p.name)}</th><td>${cells.join('')}</td></tr>`;
  }).join('') + '</tbody></table>';
}

function flash(key){ const el = document.querySelector(`[data-k="${key}"]`); if(el){ el.classList.remove('new'); void el.offsetWidth; el.classList.add('new'); } }

const EXPECT = {mb:{db:1,g1:1,g2:2,g3:6,g4:4,g5:6,g6:3,g7:4}, mn:{g8:1,g7:1,g6:3,g5:1,g4:7,g3:2,g2:1,g1:1,db:1}};
async function loadDraw(id){
  current = id;
  const r = await fetch(`${API}/v1/live/${encodeURIComponent(id)}`, {cache:'no-store'});
  if (!r.ok) { $('#title').textContent = 'Không tìm thấy kỳ quay'; return; }
  drawData = await r.json();
  drawData.expected = EXPECT[drawData.region] || EXPECT.mn;
  if (!$('#day').value) $('#day').value = drawData.draw_date;
  render(); loadSchedule(); connect(drawData.region);
}

function connect(region){
  if (es) es.close();
  es = new EventSource(`${API}/v1/live/stream?region=${region}`);
  es.onopen = () => { $('#dot').classList.add('on'); $('#connText').textContent = 'Đang nhận trực tiếp'; };
  es.onerror = () => { $('#dot').classList.remove('on'); $('#connText').textContent = 'Mất kết nối, đang thử lại…'; };
  es.addEventListener('draw.started', e => { const d = JSON.parse(e.data); log(`Bắt đầu quay ${d.draw_id}`); loadSchedule(); });
  es.addEventListener('prize.updated', e => {
    const d = JSON.parse(e.data); log(`${d.draw_id}  ${d.prize} #${d.index+1}: ${d.number}  (chưa xác minh)`);
    if (!drawData || d.draw_id !== drawData.id) return;
    const p = drawData.prizes.find(x => x.code === d.prize); if (!p) return;
    p.numbers[d.index] = d.number; drawData.provisional = true; render(); flash(`${d.prize}-${d.index}`);
  });
  es.addEventListener('draw.completed', e => log(`Đủ giải: ${JSON.parse(e.data).draw_id}, đang đối chiếu nguồn`));
  for (const t of ['draw.published','draw.corrected']) es.addEventListener(t, async e => {
    const d = JSON.parse(e.data); log(`${t === 'draw.published' ? 'Đã công bố' : 'Đã đính chính'} ${d.draw_id} (phiên bản ${d.version})`);
    loadSchedule(); if (drawData && d.draw_id === drawData.id) loadDraw(d.draw_id);
  });
}

$('#day').addEventListener('change', loadSchedule);
const today = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Ho_Chi_Minh'});
if (qs.get('draw')) loadDraw(qs.get('draw')); else { $('#day').value = today; loadSchedule(); connect('all'); }
</script>
<script src="/assets/lv-colors.js"></script>
</body>
</html>
